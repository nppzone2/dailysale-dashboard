name: Cập nhật dashboard

# Chạy khi có file Excel mới trong input/, khi sửa engine/, hoặc bấm "Run workflow" trong tab Actions.
on:
  push:
    branches: [main]
    paths: ['input/**.xlsx', 'input/**.xls', 'engine/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      che_do:
        description: 'Chọn thao tác'
        type: choice
        options: ['Cập nhật dashboard', 'Bật bảo trì', 'Tắt bảo trì']
        default: 'Cập nhật dashboard'
      thong_bao:
        description: 'Thông báo hiển thị khi bảo trì (không bắt buộc)'
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      alert: ${{ steps.dung.outputs.alert }}
      alert_msg: ${{ steps.dung.outputs.alert_msg }}
    steps:
      - uses: actions/checkout@v4

      # Lấy bản mới nhất (kho dữ liệu có thể vừa được lần chạy trước cập nhật)
      - name: Đồng bộ bản mới nhất
        run: git pull --ff-only origin main || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bật / tắt chế độ bảo trì (Actions → Cập nhật dashboard → Run workflow)
      - name: Chế độ bảo trì
        if: github.event_name == 'workflow_dispatch' && inputs.che_do != 'Cập nhật dashboard'
        env:
          CHE_DO: ${{ inputs.che_do }}
          THONG_BAO: ${{ inputs.thong_bao }}
        run: |
          node -e '
            const on = process.env.CHE_DO === "Bật bảo trì";
            const t = new Date(Date.now() + 7 * 3600e3), p = n => String(n).padStart(2, "0");
            const since = `${p(t.getUTCHours())}:${p(t.getUTCMinutes())} ${p(t.getUTCDate())}/${p(t.getUTCMonth() + 1)}/${t.getUTCFullYear()}`;
            require("fs").writeFileSync("engine/maintenance.json", JSON.stringify(on ? { on: true, message: process.env.THONG_BAO || "", since } : { on: false }, null, 2) + "\n");
            console.log(on ? "Bật bảo trì" : "Tắt bảo trì");'

      - name: Cài thư viện đọc Excel
        run: pip install pandas openpyxl

      - name: Đọc file Excel mới
        run: python engine/read_xlsx.py

      - name: Gộp dữ liệu và dựng trang đã mã hoá
        id: dung
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ASM_PASSWORD: ${{ secrets.ASM_PASSWORD }}
          NPP_PASSWORD: ${{ secrets.NPP_PASSWORD }}
          NPP_PASSWORDS: ${{ secrets.NPP_PASSWORDS }}
          ASM_PASSWORDS: ${{ secrets.ASM_PASSWORDS }}
        run: node engine/build.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # Dữ liệu đã nằm trong kho mã hoá input/vault/state.enc -> xoá file Excel gốc khỏi input/
      - name: Lưu kho mã hoá, xoá file Excel gốc
        run: |
          git config user.name "DailySale Dashboard Bot"
          git config user.email "actions@github.com"
          git add -A input/vault engine/maintenance.json
          git rm -q --cached --ignore-unmatch -- 'input/*.xlsx' 'input/*.xls' || true
          if ! git diff --cached --quiet; then
            git commit -m "Cập nhật kho dữ liệu mã hoá [skip ci]"
            git pull --rebase -q origin main
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Upload sai file nguồn hoặc số liệu bất thường -> lượt chạy báo đỏ, GitHub gửi email cho người upload
  canh-bao:
    needs: [build, deploy]
    if: needs.build.outputs.alert == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Cảnh báo dữ liệu nguồn
        env:
          MSG: ${{ needs.build.outputs.alert_msg }}
        run: |
          echo "::error title=Dữ liệu nguồn cần kiểm tra::$MSG"
          echo "Xem chi tiết ở mục Summary của lượt chạy này. Dữ liệu hợp lệ khác vẫn đã được cập nhật."
          exit 1
